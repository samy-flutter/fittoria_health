name: fittoria_patient_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_bloc: ^8.1.3
  get_it: ^7.6.0
  dio: ^5.4.0
  go_router: ^13.2.0
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.5.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  intl: ^0.19.0
  geolocator: ^10.1.0
  open_file: ^3.3.2
  path_provider: ^2.1.1
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1
  flutter_native_splash: ^2.4.3
  lucide_icons_flutter: ^3.1.14+1
  flutter_svg: ^2.3.0
  dartz: ^0.10.1
  equatable: ^2.0.8
  fl_chart: ^1.2.0
  image_picker: ^1.2.2
  flutter_cashfree_pg_sdk: ^2.4.0+52
  video_player: ^2.11.1
  chewie: ^1.13.1
  flutter_dotenv: ^6.0.1
  shimmer: ^3.0.0
  permission_handler: ^12.0.3
  pedometer: ^4.2.0
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

# ─── Native Splash Screen Configuration ───────────────────────────────────────
flutter_native_splash:
  # Background matches the Next.js header gradient base (#0a4f4f)
  color: "#0C4E4C"
  color_dark: "#0C4E4C"

  # Image used in the center of the splash (logo)
  image: assets/images/splash_logo.png
  image_dark: assets/images/splash_logo.png

  # Fullscreen splash (no status bar)
  fullscreen: true

  android_12:
    # Android 12+ splash screen icon (centered on the gradient background)
    image: assets/images/splash_logo.png
    icon_background_color: "#0C4E4C"
    image_dark: assets/images/splash_logo.png
    icon_background_color_dark: "#0C4E4C"

  android: true
  ios: true
  web: false

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/splash_logo.png"
  min_sdk_android: 21
